name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag before installing dependencies
        id: release
        run: node scripts/validate-release-tag.cjs
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          architecture: x64
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned dependencies and Electron
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build application
        run: pnpm build
      - name: Package installer without publishing
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Verify installer and create checksum
        env:
          INSTALLER_NAME: ${{ steps.release.outputs.installer }}
        run: |
          $installer = Get-Item -LiteralPath (Join-Path 'release/windows-x64' $env:INSTALLER_NAME)
          if ($installer.Length -eq 0) { throw 'Installer is empty' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:INSTALLER_NAME" | Set-Content -LiteralPath 'release/windows-x64/SHA256SUMS.txt' -Encoding utf8NoBOM
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: artifact
        with:
          name: windows-installer-${{ github.run_attempt }}
          path: |
            release/windows-x64/${{ steps.release.outputs.installer }}
            release/windows-x64/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          architecture: x64
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: release-assets
          merge-multiple: true
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.cjs release-assets
